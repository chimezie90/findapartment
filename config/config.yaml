# Apartment Finder Configuration
# Customize your search criteria and notification preferences

search:
  # Budget range in USD (will be converted to local currency for each city)
  budget:
    min_usd: 2500
    max_usd: 4000

  # Size requirements
  size:
    min_sqft: 700
    bedrooms:
      min: 1
      max: 2

  # Must-have amenities (listings without these will be filtered out)
  # Options: laundry, dishwasher, parking, gym, doorman, elevator, pets, a/c
  # Note: Craigslist basic search doesn't include amenity info
  must_have: []

  # Preferences (used for scoring, not filtering)
  # Options: quiet_neighborhood
  preferences:
    - quiet_neighborhood

  # Neighborhoods to always surface first, regardless of score.
  # Matched case-insensitively against each listing's neighborhood/area.
  preferred_neighborhoods:
    - Ørestad
    - Østerbro

# Cities to search (add/remove as needed)
cities:
  nyc:
    display_name: "New York City"
    currency: USD
    sources:
      - craigslist
      - streeteasy
      - renthop
    craigslist:
      site: newyork
      # Areas: mnh=Manhattan, brk=Brooklyn, que=Queens, brx=Bronx, stn=Staten Island
      areas:
        - mnh
        - brk
    streeteasy:
      areas:
        - nyc

  la:
    display_name: "Los Angeles"
    currency: USD
    sources:
      - craigslist
    craigslist:
      site: losangeles
      # Areas: wst=Westside, sfv=SF Valley, lac=Central LA, sgv=San Gabriel Valley, lgb=Long Beach
      areas:
        - wst
        - lac
        - sfv

  dubai:
    display_name: "Dubai"
    currency: AED
    sources:
      - propertyfinder
    propertyfinder:
      emirate: dubai

  lisbon:
    display_name: "Lisbon"
    currency: EUR
    sources:
      - casasapo

  copenhagen:
    display_name: "Copenhagen"
    currency: DKK
    sources:
      - balder
      - lejebolig
      - boligportal
    lejebolig:
      city: koebenhavn
      # Areas: city center, Frederiksberg, Østerbro, Nørrebro, Vesterbro
    boligportal:
      city: copenhagen
    balder:
      # Balder-owned buildings sit in Ørestad, Østerbro, and Copenhagen
      # suburbs (Hillerød, Espergærde, Helsingør, Solrød, Hundige).
      # Leave areas empty to fetch all of them; scoring still boosts
      # Ørestad/Østerbro via search.preferred_neighborhoods above.
      areas: []

  sri_lanka:
    display_name: "Sri Lanka"
    currency: LKR
    # Sri Lankan house rents run far below the global $2,500-4,000 budget
    # above -- override it here so affordable listings (e.g. Tangalle at
    # ~$264/mo) actually surface instead of being filtered out.
    budget:
      min_usd: 200
      max_usd: 2000
    sources:
      - lankapropertyweb
    lankapropertyweb:
      property_type: House

  bali:
    display_name: "Bali"
    currency: IDR
    sources:
      - rumah123
    rumah123:
      region: bali
      # Areas: Canggu, Seminyak, Ubud, Uluwatu, Sanur, Kuta
      areas:
        - canggu
        - seminyak
        - ubud

# Car listings ("Cars" section of the site). Run with:
#   python -m apartment_finder.main --cars --city copenhagen --no-email
# Fetches broadly (no price/type filter); filtering happens in the UI.
cars:
  copenhagen:
    display_name: "Copenhagen"
    currency: DKK
    sources:
      - dba
    dba:
      location: "0.200001"  # DBA region "København og omegn"
      max_pages: 3          # ~50 cars per page, newest first

# Email delivery settings
email:
  enabled: true
  recipients:
    - ""  # TODO: Add your Gmail address here (same as SMTP_USER in .env)
  top_picks_per_city: 3

# Scoring weights (must sum to 1.0)
# Adjust these to prioritize what matters most to you
scoring:
  weights:
    price: 0.30      # Lower price = higher score
    size: 0.20       # Larger = better
    amenities: 0.25  # Bonus amenities beyond must-haves
    location: 0.15   # Quiet neighborhood signals
    freshness: 0.10  # Newer listings preferred
